mobs:
  shadow_zombie:
    max-health: 40.0
    attack-damage: 6.0
    movement-speed: 0.30
    xp: 5

    loot:
      rotten-flesh-min: 1
      rotten-flesh-max: 2
      iron-nugget-chance: 0.25
      iron-nugget-min: 1
      iron-nugget-max: 2

progression:
  xp:
    log: 1
    coal-ore: 3
    iron-ore: 5
    gold-ore: 8
    diamond-ore: 10
    vanilla-mob-kill: 5
    custom-mob-kill: 15
    boss-mob-kill: 30

custom-items:
  void_slayer:
    material: DIAMOND_SWORD
    amount: 1

    name: "<light_purple><bold>Void Slayer</bold>"

    lore:
      - "<dark_gray>Legendary Weapon"
      - ""
      - "<gray>A blade forged in the void."
      - "<gray>Its power exceeds mortal limits."
      - ""
      - "<light_purple>Special Ability: <white>Void Strike"

    enchantments:
      SHARPNESS: 8
      UNBREAKING: 6
      LOOTING: 5

    ability:
      cooldown-seconds: 10
      range: 15.0
      damage: 18.0
      mana-cost: 30

  shadow_stone:
    material: NETHERITE_INGOT
    amount: 1
    name: "<gray>Shadow Stone</gray>"
    lore:
      - "<dark_gray>Rare Material"
      - ""
      - "<gray>A mysterious stone imbued with shadow energy."
    enchantments:
      UNBREAKING: 5

  storm_caller:
    # The base item sets combat stats (axe: heavy hits, disables shields);
    # item-model replaces how it looks with the 3D thunder hammer.
    material: DIAMOND_AXE
    amount: 1
    # Custom model from the resource pack: resourcepack/assets/survival/items/storm_caller.json
    item-model: survival:storm_caller

    name: "<gradient:#7dd3fc:#facc15><bold>Storm Caller</bold></gradient>"

    lore:
      - "<dark_gray>Legendary Thunder Hammer"
      - ""
      - "<gray>The sky answers its call."
      - ""
      - "<aqua>Special Ability: <white>Lightning Strike"
      - "<dark_gray>Right-click to strike where you aim."
      - "<dark_gray>Lightning chains to nearby enemies."

    enchantments:
      SHARPNESS: 10
      UNBREAKING: 6

    ability:
      cooldown-seconds: 6
      mana-cost: 50
      range: 20.0
      damage: 15.0                 # per bolt
      lightning-strikes: 2        # bolts per use
      strike-interval-ticks: 6    # delay between bolts (20 ticks = 1 second)
      burn-seconds: 4             # mobs hit by a bolt catch fire
      place-fire: true            # light the ground around each bolt (can spread like normal fire!)
      fire-radius: 2.0
      chain-count: 3              # extra mobs the lightning jumps to
      chain-radius: 6.0           # max jump distance in blocks
      chain-damage-multiplier: 0.6 # each jump deals 60% of the previous hit

mob-drops:
  shadow_zombie:
    item: shadow_stone
    chance: 1

traders:
  void_trader:
    name: "<light_purple><bold>Void Trader</bold>"
    profession: CLERIC

    trades:
      void_slayer_trade:
        input:
          custom-item: shadow_stone
          amount: 32
        output:
          custom-item: void_slayer
        max-uses: 999999

mana:
  max: 100
  regen-per-second: 5

hud:
  update-ticks: 5 # 20 ticks = 1 second
  bar-length: 10 # number of "|" characters per bar (text HUD only)
  resource-pack: true # image bars; players need the resource pack. false = plain text bars
