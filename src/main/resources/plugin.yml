name: MC-Survival-Plugin
version: '1.0.0'
main: com.example.survival.SurvivalMainPlugin
description: MC survival server plugin
author: hu
api-version: '26.2'

commands:
  mob:
    description: Spawn custom mobs
    usage: /mob spawn shadow_zombie
    permission: admin

  rank:
    description: View your rank and progression
    usage: /rank

  set-rank:
    description: Set a player's rank
    usage: /set-rank <player> <rank>
    permission: admin
    permission-message: "You don't have permission to use this command."

  customitem:
    description: Manage custom items
    usage: /customitem <give|list|reload>
    permission: admin
    permission-message: "You don't have permission to use this command."

  trader:
    description: Spawn a custom trader
    usage: /trader spawn <trader_id>
    permission: admin

permissions:
  admin:
    description: Allows access to admin commands
    default: op